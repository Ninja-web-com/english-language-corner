<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="English Language Corner — a collaborative space to improve reading, listening, vocabulary, and speaking through practical activities." />
  <title>English Language Corner</title>
  <style>
    :root {
      --navy: #0b1224;
      --indigo: #1e1b4b;
      --purple: #6d28d9;
      --electric: #8b5cf6;
      --cyan: #22d3ee;
      --cyan-soft: #67e8f9;
      --text: #e2e8f0;
      --text-muted: #a1b0c4;
      --bg: #0b1224;
      --bg-elevated: #111827;
      --bg-card: rgba(30, 27, 75, 0.55);
      --border: rgba(139, 92, 246, 0.25);
      --glow: rgba(34, 211, 238, 0.15);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 1rem;
      --nav-height: 4.25rem;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    section { scroll-margin-top: calc(var(--nav-height) + 1rem); }
    .container { width: min(1120px, 92%); margin-inline: auto; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#home">English Language Corner</a>
    </nav>
  </header>
  <main>
    <section id="home">
      <div class="container">
        <h1>Learn English. Speak with Confidence.</h1>
        <p>A collaborative space to improve reading, listening, vocabulary, and speaking through practical activities.</p>
      </div>
    </section>
  </main>
</body>
</html>
